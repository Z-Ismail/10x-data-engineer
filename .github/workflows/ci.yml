name: CI

on:
  push:
    branches: [main, langgraph]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Install bubblewrap
        # Ubuntu 24.04 lets a program set up a sandbox only if an AppArmor
        # profile allows it to create user namespaces; bubblewrap has none.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-pid --die-with-parent true
      - name: Run tests
        # The sandbox tests fail here, rather than being skipped, if
        # bubblewrap cannot run.
        env:
          TENX_REQUIRE_SANDBOX: "1"
        run: make test
      - name: Generate demo data
        run: make demo-data
      - name: Profile demo data
        run: make profile
      - name: Compare columns across demo tables
        run: make overlap

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.16.8"
      - name: Check
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit installed dependencies for known vulnerabilities
        run: pip-audit --skip-editable
